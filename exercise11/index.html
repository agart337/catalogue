<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            Margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 40px;
            background-color: black;
        }

        .eye {
            position: relative;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: white;
        }

        .pupil {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: black;
            transform: translate(-50%, -50%);
        }
    </style>
</head>

<body>

    <div class="eye">
        <div class="pupil"></div>
    </div>
    <div class="eye">
        <div class="pupil"></div>
    </div>

    <script src="script.js"></script>

</body>

</html>
